<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Happy Teachers' Day">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3a2f" />
      <stop offset="0.55" stop-color="#0d4638" />
      <stop offset="1" stop-color="#0f5245" />
    </linearGradient>
    <linearGradient id="petal" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#d8f5e4" />
      <stop offset="0.55" stop-color="#5fd0a1" />
      <stop offset="1" stop-color="#1da667" />
    </linearGradient>
    <linearGradient id="petalInner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#9ee9cd" />
      <stop offset="1" stop-color="#0f7f5b" />
    </linearGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffe3b8" />
      <stop offset="0.6" stop-color="#f9cd85" />
      <stop offset="1" stop-color="#e8a45c" />
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)" />

  <g>
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" />
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" transform="rotate(45 32 32)" />
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" transform="rotate(90 32 32)" />
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" transform="rotate(135 32 32)" />
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" transform="rotate(180 32 32)" />
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" transform="rotate(225 32 32)" />
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" transform="rotate(270 32 32)" />
    <ellipse cx="32" cy="17.5" rx="5.8" ry="12" fill="url(#petal)" transform="rotate(315 32 32)" />
  </g>

  <g>
    <ellipse cx="32" cy="23" rx="4.4" ry="8.6" fill="url(#petalInner)" />
    <ellipse cx="32" cy="23" rx="4.4" ry="8.6" fill="url(#petalInner)" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="23" rx="4.4" ry="8.6" fill="url(#petalInner)" transform="rotate(120 32 32)" />
    <ellipse cx="32" cy="23" rx="4.4" ry="8.6" fill="url(#petalInner)" transform="rotate(180 32 32)" />
    <ellipse cx="32" cy="23" rx="4.4" ry="8.6" fill="url(#petalInner)" transform="rotate(240 32 32)" />
    <ellipse cx="32" cy="23" rx="4.4" ry="8.6" fill="url(#petalInner)" transform="rotate(300 32 32)" />
  </g>

  <circle cx="32" cy="32" r="6.2" fill="url(#core)" />
  <circle cx="32" cy="32" r="6.2" fill="none" stroke="#0a3a2f" stroke-opacity="0.35" stroke-width="1" />
  <rect width="64" height="64" rx="15" fill="url(#sheen)" />
</svg>
